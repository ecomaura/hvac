/* ===== 3/9. NAV + FOOTER ===== */
const NAV=[["/","Home"],["/about","About Us"],["/products","Products"],["/services","Services"],["/clients","Clients"],["/contact","Contact Us"]];
function buildNav(cur){document.getElementById("navlist").innerHTML=NAV.map(([h,t])=>{const act=h==="/"?cur==="/":cur.startsWith(h);
 if(h==="/products")return`<li class="dd"><div style="display:flex;align-items:center">${L(h,t,"nl")}<button class="nl" aria-label="Toggle products menu" aria-expanded="false" data-dd>▾</button></div><div class="menu">${P.map(p=>L("/products/"+p.s,p.n)).join("")}</div></li>`.replace('class="nl"','class="nl"'+(act?' aria-current="page"':''));
 return`<li><a class="nl" href="#${h}" data-link ${act?'aria-current="page"':''}>${t}</a></li>`}).join("")}
function footer(){document.getElementById("footer").innerHTML=`<div class="wrap"><div class="fg"><div><h3>FS Aircon & Infratech</h3><p style="font-size:.9rem">HVAC, ducting, ventilation and industrial cooling equipment supplier in Thane, Maharashtra.</p>${waBtn("I would like to enquire about your products.","WhatsApp Us","wa")}</div>
<div><h3>Products</h3><ul>${P.map(p=>`<li>${L("/products/"+p.s,p.n)}</li>`).join("")}</ul></div>
<div><h3>Company</h3><ul><li>${L("/about","About Us")}</li><li>${L("/services","Services")}</li><li>${L("/clients","Clients")}</li><li>${L("/contact","Contact Us")}</li></ul></div>
<div><h3>Contact</h3><p style="font-size:.88rem">${CONFIG.address}</p><p style="font-size:.88rem"><a href="mailto:${CONFIG.email}">${CONFIG.email}</a><br>GSTIN: ${CONFIG.gstin}</p></div></div>
<div class="copy">© ${new Date().getFullYear()} ${CONFIG.name}. All rights reserved. · <a href="#/admin">Admin</a></div></div>`}

/* ===== 10. ROUTER (hash-based: works on any host, incl. file://) ===== */
function route(){const path=(location.hash.replace(/^#/,"")||"/").replace(/\/+$/,"")||"/";let pg;
 if(path==="/")pg=pages.home();else if(pages[path.slice(1)]&&path.split("/").length===2&&path!=="/nf")pg=pages[path.slice(1)]();
 else if(path.startsWith("/products/"))pg=product(path.split("/")[2]);else pg=pages.nf();
 document.title=pg.t;let m=document.querySelector('meta[name=description]');m.content=pg.d;
 const main=document.getElementById("main");main.innerHTML=pg.h;main.classList.remove("rev");void main.offsetWidth;main.classList.add("rev");
 buildNav(path);closeNav();window.scrollTo(0,0);bindForm();
 let rb=document.querySelector('meta[name=robots]');if(path==="/admin"){if(!rb){rb=document.createElement('meta');rb.name='robots';document.head.append(rb)}rb.content='noindex';adminInit()}else if(rb)rb.remove();
 document.getElementById("fab").href=wa("I would like to enquire about your HVAC products and services.")}
function closeNav(){document.body.classList.remove("nav-open");const b=document.getElementById("burger");b.setAttribute("aria-expanded","false");b.setAttribute("aria-label","Open menu")}
document.getElementById("burger").onclick=e=>{const o=document.body.classList.toggle("nav-open");e.currentTarget.setAttribute("aria-expanded",o);e.currentTarget.setAttribute("aria-label",o?"Close menu":"Open menu")};
document.addEventListener("click",e=>{const d=e.target.closest("[data-dd]");if(d){const li=d.closest(".dd");const o=li.classList.toggle("open");d.setAttribute("aria-expanded",o);return}
 if(e.target.closest("[data-link]"))closeNav()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeNav()});
window.addEventListener("hashchange",route);

/* ===== 8. FORM ===== */
function bindForm(){const f=document.getElementById("cf");if(!f)return;
 f.onsubmit=e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim();const er=(id,m)=>{document.getElementById("e-"+id).textContent=m;return !m};
 let ok=true;ok=er("n",v("n")?"":"Enter your name.")&&ok;ok=er("em",/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("em"))?"":"Enter a valid email address.")&&ok;
 ok=er("ph",v("ph").replace(/\D/g,"").length>=8?"":"Enter a valid phone number.")&&ok;ok=er("rq",v("rq")?"":"Describe your requirement.")&&ok;
 ok=er("cs",document.getElementById("cs").checked?"":"Please confirm consent.")&&ok;if(!ok)return;
 const msg=`I would like to make an enquiry.\nName: ${v("n")}\nCompany: ${v("c")||"-"}\nEmail: ${v("em")}\nPhone: ${v("ph")}\nInterest: ${v("pr")}\nRequirements: ${v("rq")}`;
 window.open(wa(msg),"_blank","noopener,noreferrer")}}

/* ===== 11. ADMIN: content editor, Cloudinary upload, GitHub publish ===== */
const CFG_KEYS=["logo","name","whatsapp","email","address","gstin"];
function renderLogo(){const i=document.getElementById("logoimg");if(i){i.style.display="";i.src=/^https?:/.test(CONFIG.logo)?CONFIG.logo:CONFIG.logo||"images/fsai-logo.png"}}
const snapshot=()=>({config:Object.fromEntries(CFG_KEYS.map(k=>[k,CONFIG[k]])),products:P,services:S,clients:CLIENTS});
const draftSave=()=>localStorage.setItem("fsai_draft",JSON.stringify(snapshot()));
function applyData(d){if(!d)return;if(d.config)CFG_KEYS.forEach(k=>{if(d.config[k]!=null)CONFIG[k]=d.config[k]});if(d.products)P=d.products;if(d.services)S=d.services;if(d.clients)CLIENTS=d.clients}
function adminInit(){
 const root=document.getElementById("adm"),COLL={products:()=>P,services:()=>S,clients:()=>CLIENTS};
 let int=JSON.parse(localStorage.getItem("fsai_int")||"{}"),tab=sessionStorage.getItem("fsai_tab")||"products";
 const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
 const msg=(t,bad)=>{const m=document.getElementById("amsg");if(m){m.textContent=t;m.style.color=bad?"#b3261e":"#1a7f45"}};
 const val=(o,k)=>k==="apps"?(o.apps||[]).join("\n"):k==="items"?(o.items||[]).map(a=>a.join(" | ")).join("\n"):o[k];
 const FL={products:[["n","Name"],["s","URL slug (letters, numbers, hyphens)"],["d","Short description","t"],["i","Introduction","t"],["f","Image","img"],["ref","WhatsApp enquiry phrase"],["apps","Applications (one per line)","t"],["items","Items (name | description, one per line)","t"]],
  services:[["n","Name"],["t","Description","t"],["a","Typical use"],["p","Linked product slug (optional)"],["f","Image","img"]],clients:[["0","Client name"],["1","Logo","img"]]};
 const blank={products:()=>({s:"new-category-"+(Date.now()%10000),n:"New category",f:"",d:"",i:"",items:[],apps:[],ref:"new products"}),services:()=>({n:"New service",t:"",a:"",p:"",f:""}),clients:()=>["New client",""]};
 const inp=(c,k,l,v,type="text",t)=>`<div class="af"><label>${l}</label>${t?`<textarea rows="3" data-c="${c}" data-k="${k}">${esc(v)}</textarea>`:`<input type="${type}" data-c="${c}" data-k="${k}" value="${esc(v)}" autocomplete="off">`}</div>`;
 const field=(c,i,o,[k,l,t])=>t==="img"?`<div class="af"><label>${l}</label><input data-c="${c}" data-i="${i}" data-k="${k}" value="${esc(val(o,k))}" placeholder="Image URL or file name">${(()=>{const u=val(o,k);return u&&/^https?:/.test(u)?`<img src="${esc(u)}" alt="" style="max-height:70px;margin-top:6px">`:""})()}<label class="btn o sm">Upload to Cloudinary<input type="file" accept="image/*" hidden data-up data-c="${c}" data-i="${i}" data-k="${k}"></label></div>`
  :`<div class="af"><label>${l}</label>${t?`<textarea rows="3" data-c="${c}" data-i="${i}" data-k="${k}">${esc(val(o,k))}</textarea>`:`<input data-c="${c}" data-i="${i}" data-k="${k}" value="${esc(val(o,k))}">`}</div>`;
 function set(c,i,k,v){
  if(c==="int"){int[k]=v;localStorage.setItem("fsai_int",JSON.stringify(int));return}
  if(c==="config"){CONFIG[k]=v;if(k==="logo")renderLogo()}else{const o=COLL[c]()[+i];
   if(k==="apps")o.apps=v.split("\n").map(x=>x.trim()).filter(Boolean);
   else if(k==="items")o.items=v.split("\n").filter(x=>x.trim()).map(x=>{const[a,...b]=x.split("|");return[a.trim(),b.join("|").trim()]});
   else o[k]=v}
  draftSave()}
 function draw(){
  const T=[["products","Products"],["services","Services"],["clients","Clients"],["settings","Settings"],["publish","Publish"]];
  let h=`<div class="atabs">${T.map(([t,l])=>`<button class="btn sm ${t===tab?"":"o"}" data-act="tab" data-t="${t}">${l}</button>`).join("")}</div><p id="amsg" role="status"></p>`;
  if(COLL[tab]){h+=COLL[tab]().map((o,i)=>`<details class="card ad"><summary>${esc(o.n||o[0]||"Untitled")}</summary><div class="b">${FL[tab].map(f=>field(tab,i,o,f)).join("")}<div class="row"><button class="btn o sm" data-act="up" data-c="${tab}" data-i="${i}">Move up</button><button class="btn o sm" data-act="down" data-c="${tab}" data-i="${i}">Move down</button><button class="btn sm" style="background:#b3261e;border-color:#b3261e" data-act="del" data-c="${tab}" data-i="${i}">Remove</button></div></div></details>`).join("")+`<button class="btn" data-act="add" data-c="${tab}">Add ${tab.slice(0,-1)}</button>`}
  else if(tab==="settings"){h+=`<h2>Logo</h2>${field("config","",CONFIG,["logo","Logo image (file path or URL)","img"])}<h2>Business details</h2><div class="ag">${CFG_KEYS.filter(k=>k!=="logo").map(k=>inp("config",k,k==="whatsapp"?"WhatsApp number (country code, no +)":k[0].toUpperCase()+k.slice(1),CONFIG[k])).join("")}</div>
   <h2>Cloudinary (unsigned upload)</h2><div class="ag">${inp("int","cloud","Cloud name",int.cloud)}${inp("int","preset","Unsigned upload preset",int.preset)}</div>
   <h2>GitHub</h2><div class="ag">${inp("int","owner","Owner",int.owner)}${inp("int","repo","Repository",int.repo)}${inp("int","branch","Branch (default main)",int.branch)}${inp("int","path","Content file path (default content.json)",int.path)}${inp("int","token","Personal access token",int.token,"password")}</div>
   <p class="note">Cloudinary and GitHub settings, including the token, are stored only in this browser. Use a fine-grained token limited to this repository with Contents read and write access.</p>`}
  else{h+=`<h2>Publish</h2><p>Changes save as a draft in this browser and show here immediately. Publishing commits <code>${esc(int.path||"content.json")}</code> to GitHub; your host then serves it to everyone.</p><div class="row"><button class="btn wa" data-act="pub">Publish to GitHub</button><button class="btn o" data-act="export">Download content.json</button><button class="btn o" data-act="reset">Discard draft</button></div>`}
  root.innerHTML=h}
 async function upload(file){if(!int.cloud||!int.preset)throw Error("Add the Cloudinary cloud name and upload preset in Settings.");
  const fd=new FormData();fd.append("file",file);fd.append("upload_preset",int.preset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${int.cloud}/image/upload`,{method:"POST",body:fd}),j=await r.json();
  if(!r.ok)throw Error(j.error?.message||"Upload failed");return j.secure_url.replace("/upload/","/upload/f_auto,q_auto,w_1000/")}
 async function publish(){const branch=int.branch||"main",path=int.path||"content.json";
  if(!int.owner||!int.repo||!int.token)return msg("Add the GitHub owner, repository and token in Settings.",1);
  const api=`https://api.github.com/repos/${int.owner}/${int.repo}/contents/${path}`,h={Authorization:"Bearer "+int.token,Accept:"application/vnd.github+json"};
  try{msg("Publishing...");let sha;const g=await fetch(`${api}?ref=${encodeURIComponent(branch)}`,{headers:h});
   if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw Error("GitHub error "+g.status+" reading the file. Check owner, repository and token.");
   const body={message:"Update site content via admin",branch,sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(snapshot(),null,2))))};
   const p=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify(body)});if(!p.ok)throw Error("GitHub: "+((await p.json()).message||p.status));
   msg("Published. The live site updates once your host redeploys.")}catch(e){msg(e.message,1)}}
 root.oninput=e=>{const t=e.target;if(t.dataset.k!==undefined&&t.type!=="file")set(t.dataset.c,t.dataset.i,t.dataset.k,t.value)};
 root.onchange=async e=>{const t=e.target;if(!t.matches("[data-up]")||!t.files[0])return;msg("Uploading...");
  try{const u=await upload(t.files[0]);set(t.dataset.c,t.dataset.i,t.dataset.k,u);draw();msg("Image uploaded.")}catch(err){msg(err.message,1)}};
 root.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,c=b.dataset.c,i=+b.dataset.i;
  if(a==="tab"){tab=b.dataset.t;sessionStorage.setItem("fsai_tab",tab);return draw()}
  if(a==="add"){COLL[c]().push(blank[c]());draftSave();return draw()}
  if(a==="del"){if(confirm("Remove this entry?")){COLL[c]().splice(i,1);draftSave();draw()}return}
  if(a==="up"||a==="down"){const arr=COLL[c](),j=a==="up"?i-1:i+1;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];draftSave();return draw()}
  if(a==="pub")return publish();
  if(a==="export"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,2)],{type:"application/json"}));l.download="content.json";l.click();return}
  if(a==="reset"&&confirm("Discard your draft and reload the published content?")){localStorage.removeItem("fsai_draft");location.reload()}};
 draw()}

/* ===== 10b. INIT: published content.json, then local draft ===== */
(async()=>{
 try{const r=await fetch("content.json",{cache:"no-store"});if(r.ok)applyData(await r.json())}catch(e){}
 try{const d=localStorage.getItem("fsai_draft");if(d)applyData(JSON.parse(d))}catch(e){}
 renderLogo();footer();route()})();
</script>
